name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Compile check
        run: cd backend && python -m compileall app
      - name: Run unit tests
        run: cd backend && python -m pytest ../tests -q

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      TEST_TARGET_URL: ${{ secrets.TEST_TARGET_URL }}
    steps:
      - name: Skip (no secrets configured)
        if: ${{ env.OPENAI_API_KEY == '' || env.TEST_TARGET_URL == '' }}
        run: echo "Skipped - set OPENAI_API_KEY + TEST_TARGET_URL secrets to enable E2E smoke."
      - uses: actions/checkout@v4
        if: ${{ env.OPENAI_API_KEY != '' && env.TEST_TARGET_URL != '' }}
      - uses: actions/setup-python@v5
        if: ${{ env.OPENAI_API_KEY != '' && env.TEST_TARGET_URL != '' }}
        with:
          python-version: "3.12"
      - name: Install deps + browser
        if: ${{ env.OPENAI_API_KEY != '' && env.TEST_TARGET_URL != '' }}
        run: |
          cd backend
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: AI test selection + E2E execution (smoke)
        if: ${{ env.OPENAI_API_KEY != '' && env.TEST_TARGET_URL != '' }}
        run: |
          cd backend
          python -m app.cli run --objective "smoke test" \
            --url "$TEST_TARGET_URL" --priority P0 --limit 5

  langsmith-eval:
    runs-on: ubuntu-latest
    needs: e2e-smoke
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    steps:
      - name: Skip (no secrets configured)
        if: ${{ env.OPENAI_API_KEY == '' || env.LANGSMITH_API_KEY == '' }}
        run: echo "Skipped - set OPENAI_API_KEY + LANGSMITH_API_KEY secrets to enable LangSmith eval."
      - uses: actions/checkout@v4
        if: ${{ env.OPENAI_API_KEY != '' && env.LANGSMITH_API_KEY != '' }}
      - uses: actions/setup-python@v5
        if: ${{ env.OPENAI_API_KEY != '' && env.LANGSMITH_API_KEY != '' }}
        with:
          python-version: "3.12"
      - name: Install deps
        if: ${{ env.OPENAI_API_KEY != '' && env.LANGSMITH_API_KEY != '' }}
        run: cd backend && pip install -r requirements.txt
      - name: Run LangSmith evaluation (quality gate)
        if: ${{ env.OPENAI_API_KEY != '' && env.LANGSMITH_API_KEY != '' }}
        run: |
          cd backend
          python -m app.evaluation.run_eval --datasets test-generation-accuracy,root-cause-accuracy
